name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build SpiceFix.exe
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o SpiceFix.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceFix
          path: SpiceFix.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpiceFix.exe
