name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Version
        run: |
          V="${{ github.event.release.tag_name || github.ref_name }}"
          case "$V" in v[0-9]*) V="${V#v}" ;; *) V="$(jq -r '.RT_VERSION["#1"]["0000"].info["0409"].ProductVersion' winres/winres.json)" ;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Embed Windows version info and manifest
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --product-version "$VERSION" --file-version "$VERSION"
      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.appVersion=$VERSION" -o dist/SpiceFix.exe
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.appVersion=$VERSION" -o dist/SpiceFix-linux-amd64
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.appVersion=$VERSION" -o dist/SpiceFix-linux-arm64
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceFix
          path: dist/*
      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*
