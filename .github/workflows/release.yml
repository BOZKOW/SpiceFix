name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/SpiceFix.exe
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o dist/SpiceFix-linux-amd64
          GOOS=linux   GOARCH=arm64 go build -ldflags "-s -w" -o dist/SpiceFix-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceFix
          path: dist/*
      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*
